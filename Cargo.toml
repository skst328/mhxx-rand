[workspace]
members = ["rand-core", "python"]
resolver = "3"

# version は Rust のクレートと Python のパッケージ (python/Cargo.toml から maturin が読む) で共通
[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/skst328/mhxx-rand"

[profile.release]
lto = true

# テストでも 10 億フレームの検索を流すので、最適化して作る
[profile.test]
opt-level = 3
